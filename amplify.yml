version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `npm ci` needs the committed lockfile and installs exactly what was
        # tested locally. Playwright browsers are not needed for a build.
        - npm ci --include=dev
    build:
      commands:
        - npm run lint
        - npx tsc --noEmit
        - npm run test:unit -- --run
        - npm run build
  artifacts:
    # Next.js SSR on Amplify is served from the .next output; Amplify detects
    # the compute platform from next.config.ts and package.json.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
