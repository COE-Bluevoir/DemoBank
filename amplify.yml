version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `npm ci` needs the committed lockfile and installs exactly what was
        # tested locally. Playwright browsers are not needed for a build.
        - npm ci --include=dev
    build:
      commands:
        # Amplify exposes app environment variables to the build container but
        # not to the SSR compute runtime. Writing them to .env.production is
        # what carries them through to the running server.
        #
        # This list must be kept in sync with every variable name in
        # src/lib/config/env.ts's envSchema by hand — nothing enforces it
        # automatically. A variable added there and set correctly in the
        # Amplify console still silently never reaches the running server
        # until its name is added here too (confirmed live 2026-08-19: three
        # new OAuth variables were set in the console, the build succeeded,
        # and the endpoint still failed auth until this list caught up).
        #
        # AWS_REGION is deliberately excluded: it is reserved and supplied by
        # the Lambda runtime.
        - |
          for key in ORCHESTRATION_MODE DEMO_SCENARIO DEMO_CONTROL_ENABLED DEMO_CONTROL_PASSCODE \
                     STORAGE_DRIVER DYNAMODB_TABLE_NAME S3_DOCUMENT_BUCKET DOCUMENT_STORAGE_DIR \
                     AGENT_PROVIDER BEDROCK_REGION BEDROCK_MODEL_ID BEDROCK_REASONING_MODEL_ID \
                     PEGA_BASE_URL PEGA_TOKEN_URL PEGA_CLIENT_ID PEGA_CLIENT_SECRET \
                     PEGA_CASE_TYPE_ID PEGA_TIMEOUT_MS PEGA_UPLOAD_TIMEOUT_MS PEGA_MAX_RETRIES \
                     PEGA_TOKEN_SKEW_SECONDS PEGA_DEMO_MODE_DEFAULT SERVICE_API_KEY \
                     MCP_OAUTH_CLIENT_ID MCP_OAUTH_CLIENT_SECRET MCP_OAUTH_SIGNING_KEY \
                     ASSISTANT_PROVIDER PEGA_ASSISTANT_URL OPENAI_API_KEY OPENAI_MODEL; do
            if [ -n "${!key}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> .env.production
            fi
          done
        - echo "carried $(wc -l < .env.production 2>/dev/null || echo 0) settings into the runtime"
        - npm run lint
        - npx tsc --noEmit
        - npm run test:unit -- --run
        - npm run build
  artifacts:
    # Next.js SSR on Amplify is served from the .next output; Amplify detects
    # the compute platform from next.config.ts and package.json.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
